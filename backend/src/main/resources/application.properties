spring.application.name=traceon
# Mesma porta da API .NET: o proxy do Vite (TRACEON_API_URL) e o README não mudaram no corte (ADR 0009).
server.port=5120
spring.threads.virtual.enabled=true

# Logs em JSON (Elastic Common Schema) no stdout, uma linha por evento, com o trace id. Para ler no terminal,
# o profile plain-logs volta ao texto.
logging.structured.format.console=ecs

# Banco: SPRING_DATASOURCE_URL (jdbc:postgresql://host:porta/banco), SPRING_DATASOURCE_USERNAME e
# SPRING_DATASOURCE_PASSWORD. Sem URL válida a aplicação não sobe (DataSourceConfiguration).
#
# A partida não abre conexão: a aplicação sobe com o banco fora do ar e a liveness responde (ADR 0004). Por isso o
# Hibernate não lê metadados do banco na subida (dialeto e versão vêm daqui) e não valida o schema: não há
# entidades, e quando houver a validação roda nos testes de integração, contra as migrations.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=18

# Migrations nunca na partida (ADR 0008): aplicadas por comando explícito.
spring.flyway.enabled=false

# Erros em Problem Details (404, 405); o 500 vem do ProblemDetailErrorController.
spring.mvc.problemdetails.enabled=true
# API só de JSON: sem arquivos estáticos, uma rota desconhecida é 404 do MVC.
spring.web.resources.add-mappings=false

# Correlation ID = trace id W3C. Só o traceparent W3C entra; o sampler ignora a decisão de amostragem do cliente.
# Nada é exportado sem coletor configurado (etapa 6).
management.tracing.propagation.consume=w3c
management.tracing.propagation.produce=w3c
management.tracing.baggage.enabled=false
management.opentelemetry.tracing.sampler=trace-id-ratio
management.otlp.metrics.export.enabled=false

# Spec OpenAPI desligada, como em produção; o profile api-docs a liga. A versionada é docs/api/openapi.json.
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/openapi/v1.json
springdoc.api-docs.version=openapi_3_1
springdoc.default-produces-media-type=application/json
# /error é o encaminhamento interno do Tomcat, não uma operação da API.
springdoc.paths-to-exclude=${server.error.path:/error}
# Saída estável, para o diff de docs/api/openapi.json mostrar só mudança de contrato.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
