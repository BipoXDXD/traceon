name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: os jobs só leem o repositório. Quem precisar de mais declara no próprio job.
permissions:
  contents: read

# Uma execução por ref: um push novo cancela a anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dono da spec: o OpenApiDocumentIT falha se docs/api/openapi.json divergir da que a API gera.
  backend:
    name: Backend (formatação, build, análise de dependências e testes)
    # Versão fixa do runner: ubuntu-latest muda de imagem sem aviso. O Docker já vem na imagem, para o
    # Testcontainers.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # verify: compila com -Xlint:all -Werror, roda os testes rápidos e os de integração (PostgreSQL via
      # Testcontainers; o Docker já vem no runner), confere a formatação (Spotless), as dependências declaradas
      # (dependency:analyze-only) e o drift da spec. O wrapper confere o sha256 da distribuição do Maven.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar relatórios dos testes
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/openapi.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, tipos, testes e build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Testes
        env:
          CI: "true"
        run: npm test

      - name: Build
        run: npm run build

  api-spec:
    name: Spec OpenAPI (Spectral + OWASP)
    # Lê a spec versionada; o OpenApiDocumentIT do job backend garante que ela é a mesma que a API gera.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SPECTRAL_CLI_VERSION: 6.16.3
      SPECTRAL_OWASP_RULESET_VERSION: 2.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      # O Spectral procura o ruleset OWASP ao lado do .spectral.yaml; NODE_PATH aponta para o node_modules
      # temporário do npx (primeiro item do PATH dentro do -c), onde as duas versões exatas foram instaladas.
      - name: Lint da spec
        run: |
          # shellcheck disable=SC2016 # aspas simples de propósito: o PATH é o do shell aberto pelo npx -c
          npx --yes \
            -p "@stoplight/spectral-cli@${SPECTRAL_CLI_VERSION}" \
            -p "@stoplight/spectral-owasp-ruleset@${SPECTRAL_OWASP_RULESET_VERSION}" \
            -c 'NODE_PATH="${PATH%%/.bin:*}" spectral lint docs/api/openapi.json --fail-severity=warn'

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Binário oficial com versão e checksum fixos, em vez de gitleaks/gitleaks-action:
      # a action exige GITLEAKS_LICENSE em repositórios de organização, e o binário (MIT)
      # roda igual em qualquer dono, sem segredo nenhum. O sha256 vem do arquivo
      # gitleaks_8.30.1_checksums.txt da release.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout com o histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar o gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Procurar segredos no histórico
        # --redact: o valor do segredo não vai para o log público da execução.
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .'
